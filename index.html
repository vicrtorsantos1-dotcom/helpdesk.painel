<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/x-icon" href="favicon-32x32.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Helpdesk - Avançado</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; margin: 20px; }
        h2 { color: #333; margin-bottom: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* Estilo dos Filtros e Pesquisa */
        .filtros-container { display: flex; gap: 15px; margin-bottom: 20px; background: white; padding: 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); align-items: center; flex-wrap: wrap; }
        .filtro-grupo { display: flex; flex-direction: column; gap: 5px; }
        .filtro-grupo label { font-size: 12px; font-weight: bold; color: #666; text-transform: uppercase; }
        .filtros-container input, .filtros-container select { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; min-width: 200px; }
        
        /* Tabela e Badges */
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 6px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #0056b3; color: white; }
        tr.linha-chamado { cursor: pointer; }
        tr.linha-chamado:hover { background-color: #f1f1f1; }
        
        .badge { padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .badge-alta { background-color: #ffcccc; color: #cc0000; }
        .badge-media { background-color: #ffe6cc; color: #cc6600; }
        .badge-baixa { background-color: #e6ffcc; color: #006600; }
        
        .status-pendente { color: #d9534f; font-weight: bold; }
        .status-andamento { color: #f0ad4e; font-weight: bold; }
        .status-resolvido { color: #5cb85c; font-weight: bold; }
        
        .btn-acao { color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-iniciar { background-color: #007bff; }
        .btn-iniciar:hover { background-color: #0056b3; }
        .btn-finalizar { background-color: #28a745; }
        .btn-finalizar:hover { background-color: #218838; }
        
        .loading { font-size: 18px; font-weight: bold; color: #666; text-align: center; margin-top: 40px; }

        /* Estilos do Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-conteudo { background: white; width: 90%; max-width: 600px; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-fechar { position: absolute; top: 15px; right: 15px; font-size: 20px; font-weight: bold; color: #aaa; cursor: pointer; border: none; background: none; }
        .modal-fechar:hover { color: #000; }
        
        .campo-detalhe { margin-bottom: 15px; }
        .campo-detalhe label { font-size: 12px; font-weight: bold; color: #666; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .campo-detalhe p { font-size: 15px; color: #333; margin: 0; background: #f8f9fa; padding: 10px; border-radius: 4px; border: 1px solid #eee; }
        
        textarea.campo-solucao { width: 100%; height: 100px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: Arial, sans-serif; resize: vertical; box-sizing: border-box; }
        .modal-rodape { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Painel de Gerenciamento - Helpdesk</h2>
    
    <!-- Seção de Filtros -->
    <div class="filtros-container">
        <div class="filtro-grupo">
            <label for="pesquisa-nome">Buscar Usuário:</label>
            <input type="text" id="pesquisa-nome" placeholder="Digite o nome..." oninput="filtrarChamados()">
        </div>
        
        <div class="filtro-grupo">
            <label for="filtro-status">Filtrar por Status:</label>
            <select id="filtro-status" onchange="filtrarChamados()">
                <option value="Todos">Todos os Chamados</option>
                <option value="Pendente" selected>Apenas Pendentes</option>
                <option value="Em Andamento">Em Andamento</option>
                <option value="Resolvido">Apenas Resolvidos</option>
            </select>
        </div>
    </div>

    <div id="loading" class="loading">Buscando chamados ativos...</div>
    
    <table id="tabela-chamados" style="display: none;">
        <thead>
            <tr>
                <th>Usuário</th>
                <th>Categoria</th>
                <th>Prioridade</th>
                <th>Descrição</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="corpo-tabela">
            <!-- Os chamados entrarão aqui dinamicamente -->
        </tbody>
    </table>
</div>

<!-- Modal de Detalhes do Chamado -->
<div id="modal-chamado" class="modal-overlay">
    <div class="modal-conteudo">
        <button class="modal-fechar" onclick="fecharModal()">&times;</button>
        <h3 style="margin-top:0;" id="modal-titulo">Detalhes do Chamado</h3>
        
        <div class="campo-detalhe">
            <label>Usuário</label>
            <p id="modal-usuario">-</p>
        </div>
        
        <div style="display: flex; gap: 15px;">
            <div class="campo-detalhe" style="flex: 1;">
                <label>Categoria</label>
                <p id="modal-categoria">-</p>
            </div>
            <div class="campo-detalhe" style="flex: 1;">
                <label>Prioridade</label>
                <p id="modal-prioridade">-</p>
            </div>
            <div class="campo-detalhe" style="flex: 1;">
                <label>Status</label>
                <p id="modal-status">-</p>
            </div>
        </div>

        <div class="campo-detalhe">
            <label>Descrição do Problema</label>
            <p id="modal-descricao">-</p>
        </div>

        <div class="campo-detalhe" id="container-solucao">
            <label for="txt-solucao">Solução Técnica <span style="color:red">*</span></label>
            <textarea id="txt-solucao" class="campo-solucao" placeholder="Descreva a solução aplicada obrigatoriamente antes de finalizar..."></textarea>
        </div>

        <div class="modal-rodape" id="modal-acoes">
            <!-- Botões dinâmicos de acordo com o status -->
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwtT6_1o3erymdvRp8zswWjSzu0gJa6BHvvul8w6_Y9fWBVDGRRqfnWlvvbgawQyZPmqw/exec';
    
    let todosOsChamados = [];
    let chamadoAtual = null;

    // Carrega chamados da planilha
    async function carregarChamados() {
        try {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('tabela-chamados').style.display = 'none';

            const response = await fetch(SCRIPT_URL);
            todosOsChamados = await response.json();
            
            filtrarChamados();

            document.getElementById('loading').style.display = 'none';
            document.getElementById('tabela-chamados').style.display = 'table';
        } catch (error) {
            document.getElementById('loading').innerText = 'Erro ao carregar chamados.';
            console.error(error);
        }
    }

    // Filtra e renderiza a tabela
    function filtrarChamados() {
        const termoPesquisa = document.getElementById('pesquisa-nome').value.toLowerCase();
        const statusSelecionado = document.getElementById('filtro-status').value;
        const corpoTabela = document.getElementById('corpo-tabela');
        
        corpoTabela.innerHTML = '';

        todosOsChamados.forEach(chamado => {
            const bateComNome = chamado.nome.toLowerCase().includes(termoPesquisa);
            const bateComStatus = statusSelecionado === 'Todos' || chamado.status === statusSelecionado;

            if (bateComNome && bateComStatus) {
                const tr = document.createElement('tr');
                tr.className = 'linha-chamado';
                tr.onclick = () => abrirModal(chamado);
                
                let classePrioridade = 'badge-baixa';
                if(chamado.prioridade === 'Alta') classePrioridade = 'badge-alta';
                if(chamado.prioridade === 'Média') classePrioridade = 'badge-media';

                let classeStatus = 'status-pendente';
                if(chamado.status === 'Em Andamento') classeStatus = 'status-andamento';
                if(chamado.status === 'Resolvido') classeStatus = 'status-resolvido';

                tr.innerHTML = `
                    <td><b>${chamado.nome}</b><br><small>${chamado.email}</small></td>
                    <td>${chamado.categoria}</td>
                    <td><span class="badge ${classePrioridade}">${chamado.prioridade}</span></td>
                    <td>${chamado.descricao.substring(0, 60)}${chamado.descricao.length > 60 ? '...' : ''}</td>
                    <td><span class="${classeStatus}">${chamado.status || 'Pendente'}</span></td>
                `;
                corpoTabela.appendChild(tr);
            }
        });
    }

    // Abre o Modal com os dados detalhados
    function abrirModal(chamado) {
        chamadoAtual = chamado;
        document.getElementById('modal-usuario').innerHTML = `${chamado.nome} (${chamado.email})`;
        document.getElementById('modal-categoria').innerText = chamado.categoria;
        document.getElementById('modal-prioridade').innerText = chamado.prioridade;
        document.getElementById('modal-status').innerText = chamado.status || 'Pendente';
        document.getElementById('modal-descricao').innerText = chamado.descricao;
        
        const txtSolucao = document.getElementById('txt-solucao');
        const containerSolucao = document.getElementById('container-solucao');
        const containerAcoes = document.getElementById('modal-acoes');
        
        txtSolucao.value = chamado.solucao || '';
        containerAcoes.innerHTML = '';

        if (chamado.status === 'Resolvido') {
            txtSolucao.readOnly = true;
            containerSolucao.style.display = 'block';
        } else if (chamado.status === 'Em Andamento') {
            txtSolucao.readOnly = false;
            containerSolucao.style.display = 'block';
            containerAcoes.innerHTML = `<button class="btn-acao btn-finalizar" onclick="finalizarChamado()">Finalizar Chamado</button>`;
        } else {
            // Status Pendente ou não definido
            containerSolucao.style.display = 'none';
            containerAcoes.innerHTML = `<button class="btn-acao btn-iniciar" onclick="iniciarChamado()">Iniciar Chamado</button>`;
        }

        document.getElementById('modal-chamado').style.display = 'flex';
    }

    function fecharModal() {
        document.getElementById('modal-chamado').style.display = 'none';
        chamadoAtual = null;
    }

    // Iniciar chamado (altera status para 'Em Andamento')
    async function iniciarChamado() {
        try {
            await fetch(`${SCRIPT_URL}?action=updateStatus&row=${chamadoAtual.row}&status=Em Andamento`, {
                method: 'POST'
            });
            fecharModal();
            await carregarChamados();
        } catch (error) {
            alert("Erro ao iniciar chamado.");
            console.error(error);
        }
    }

    // Finalizar chamado (valida solução obrigatória e altera para 'Resolvido')
    async function finalizarChamado() {
        const solucao = document.getElementById('txt-solucao').value.trim();

        if (!solucao) {
            alert("É obrigatório descrever a solução antes de finalizar o chamado!");
            document.getElementById('txt-solucao').focus();
            return;
        }

        try {
            await fetch(`${SCRIPT_URL}?action=updateStatus&row=${chamadoAtual.row}&status=Resolvido&solucao=${encodeURIComponent(solucao)}`, {
                method: 'POST'
            });
            fecharModal();
            await carregarChamados();
        } catch (error) {
            alert("Erro ao finalizar chamado.");
            console.error(error);
        }
    }

    carregarChamados();
</script>

</body>
</html>
