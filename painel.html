<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Helpdesk - Avançado</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; margin: 20px; }
        h2 { color: #333; margin-bottom: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* Estilo dos Filtros e Pesquisa */
        .filtros-container { display: flex; gap: 15px; margin-bottom: 20px; background: white; padding: 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); align-items: center; flex-wrap: wrap; }
        .filtro-grupo { display: flex; flex-direction: column; gap: 5px; }
        .filtro-grupo label { font-size: 12px; font-weight: bold; color: #666; text-transform: uppercase; }
        .filtros-container input, .filtros-container select { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; min-width: 200px; }
        
        /* Tabela e Badges */
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-radius: 6px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #0056b3; color: white; }
        tr:hover { background-color: #f1f1f1; }
        .badge { padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .badge-alta { background-color: #ffcccc; color: #cc0000; }
        .badge-media { background-color: #ffe6cc; color: #cc6600; }
        .badge-baixa { background-color: #e6ffcc; color: #006600; }
        .status-pendente { color: #d9534f; font-weight: bold; }
        .status-resolvido { color: #5cb85c; font-weight: bold; }
        .btn-baixa { background-color: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-baixa:hover { background-color: #218838; }
        .loading { font-size: 18px; font-weight: bold; color: #666; text-align: center; margin-top: 40px; }

        /* Classes de Controle da Descrição */
        .descricao-truncada {
            max-width: 250px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        /* Quando clicada, expande e mostra tudo */
        .descricao-expandida {
            white-space: pre-wrap;
            word-break: break-word;
            cursor: pointer;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Painel de Gerenciamento - Helpdesk</h2>
    
    <!-- Seção de Filtros -->
    <div class="filtros-container">
        <div class="filtro-grupo">
            <label for="pesquisa-nome">Buscar Usuário:</label>
            <input type="text" id="pesquisa-nome" placeholder="Digite o nome..." oninput="filtrarChamados()">
        </div>
        
        <div class="filtro-grupo">
            <label for="filtro-status">Filtrar por Status:</label>
            <select id="filtro-status" onchange="filtrarChamados()">
                <option value="Todos">Todos os Chamados</option>
                <option value="Pendente" selected>Apenas Pendentes</option>
                <option value="Resolvido">Apenas Resolvidos</option>
                <option value="hoje">Chamados de Hoje</option>
            </select>
        </div>

        <div class="filtro-grupo">
            <label for="filtro-data">Filtrar por Data:</label>
            <input type="date" id="filtro-data" onchange="filtrarChamados()">
        </div>

        <div class="filtro-grupo" style="justify-content: flex-end;">
            <button id="btn-relatorio" onclick="gerarRelatorioFiltrado()" style="padding: 10px 15px; cursor: pointer; font-weight: bold;">
                Gerar Relatório Filtrado
            </button>
        </div>
    </div>

    <div id="loading" class="loading">Buscando chamados ativos...</div>
    
    <table id="tabela-chamados" style="display: none;">
        <thead>
            <tr>
                <th>Usuário</th>
                <th>Categoria</th>
                <th>Prioridade</th>
                <th>Descrição</th>
                <th>Status</th>
                <th>Ações</th>
		<th>Data</th>
            </tr>
        </thead>
        <tbody id="corpo-tabela">
            <!-- Os chamados entrarão aqui dinamicamente -->
        </tbody>
    </table>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx-0RoFXswH_-b-lM3D0vvJGvtYfeORFWCK8uVbnrbXFnoJX6uA2upUM9QKnP8Ur9tU/exec';
    
    let todosOsChamados = [];

    // Busca os dados da Planilha
    async function carregarChamados() {
        try {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('tabela-chamados').style.display = 'none';

            const response = await fetch(SCRIPT_URL);
            todosOsChamados = await response.json();
            
            filtrarChamados();

            document.getElementById('loading').style.display = 'none';
            document.getElementById('tabela-chamados').style.display = 'table';
        } catch (error) {
            document.getElementById('loading').innerText = 'Erro ao carregar chamados.';
            console.error(error);
        }
    }

    // Processa a pesquisa e os filtros sem precisar recarregar a página
    function filtrarChamados() {
        const termoPesquisa = document.getElementById('pesquisa-nome').value.toLowerCase();
        const statusSelecionado = document.getElementById('filtro-status').value;
        const dataSelecionada = document.getElementById('filtro-data').value; 
        const corpoTabela = document.getElementById('corpo-tabela');
        
        corpoTabela.innerHTML = ''; 

        let dataFormatadaFiltro = '';
        if (dataSelecionada) {
            const partes = dataSelecionada.split('-');
            dataFormatadaFiltro = `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        todosOsChamados.forEach(chamado => {
            const bateComNome = chamado.nome.toLowerCase().includes(termoPesquisa);
            
            // Tratamento especial para opção customizada "Chamados de Hoje"
            let bateComStatus = false;
            if (statusSelecionado === 'Todos') {
                bateComStatus = true;
            } else if (statusSelecionado === 'hoje') {
                const hojeFormatado = new Date().toLocaleDateString('pt-BR');
                bateComStatus = chamado.data && chamado.data.includes(hojeFormatado);
            } else {
                bateComStatus = chamado.status === statusSelecionado;
            }
            
            let bateComData = true;
            if (dataFormatadaFiltro && chamado.data) {
                bateComData = chamado.data.includes(dataFormatadaFiltro);
            }

            if (bateComNome && bateComStatus && bateComData) {
                const tr = document.createElement('tr');
                
                let classePrioridade = 'badge-baixa';
                if(chamado.prioridade === 'Alta') classePrioridade = 'badge-alta';
                if(chamado.prioridade === 'Média') classePrioridade = 'badge-media';

                const ehPendente = chamado.status === 'Pendente';
                const classeStatus = ehPendente ? 'status-pendente' : 'status-resolvido';
                
                const botaoAcao = ehPendente 
                    ? `<button class="btn-baixa" onclick="darBaixa(${chamado.row})">Concluir</button>` 
                    : `✅ Finalizado`;

                tr.innerHTML = `
                    <td><b>${chamado.nome}</b><br><small>${chamado.email}</small></td>
                    <td>${chamado.categoria}</td>
                    <td><span class="badge ${classePrioridade}">${chamado.prioridade}</span></td>
                    <td class="descricao-truncada" onclick="toggleDescricao(this)" title="Clique para expandir/recolher">${chamado.descricao}</td>
                    <td><span class="${classeStatus}">${chamado.status}</span></td>
                    <td>${botaoAcao}</td>
                `;
                corpoTabela.appendChild(tr);
            }
        });
    }

    // Alterna a visualização da descrição (Truncada / Expandida)
    function toggleDescricao(elemento) {
        if (elemento.classList.contains('descricao-truncada')) {
            elemento.classList.remove('descricao-truncada');
            elemento.classList.add('descricao-expandida');
        } else {
            elemento.classList.remove('descricao-expandida');
            elemento.classList.add('descricao-truncada');
        }
    }

    // Gera o relatório baseado exatamente no que está filtrado e visível na tabela
    function generarRelatorioFiltrado() {
        const linhas = document.querySelectorAll("#corpo-tabela tr");
        let dadosRelatorio = [];

        linhas.forEach(linha => {
            const colunas = linha.querySelectorAll("td");
            if (colunas.length >= 5) {
                const dadosUsuario = colunas[0].innerText.replace(/\n/g, " ").trim();
                
                dadosRelatorio.push({
                    usuario: dadosUsuario,
                    categoria: colunas[1].innerText.trim(),
                    prioridade: colunas[2].innerText.trim(),
                    descricao: colunas[3].innerText.trim(),
                    status: colunas[4].innerText.trim()
                });
            }
        });

        if (dadosRelatorio.length === 0) {
            alert("Não há chamados exibidos na tabela para gerar o relatório.");
            return;
        }

        let csvContent = "\uFEFF"; 
        csvContent += "Usuário;Categoria;Prioridade;Descrição;Status\n";

        dadosRelatorio.forEach(item => {
            csvContent += `"${item.usuario}";"${item.categoria}";"${item.prioridade}";"${item.descricao}";"${item.status}"\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        
        const dataHoje = new Date().toLocaleDateString('pt-BR').replace(/\//g, '-');
        link.setAttribute("href", url);
        link.setAttribute("download", `relatorio_chamados_filtrados_${dataHoje}.csv`);
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Executa a baixa do chamado na planilha
    async function darBaixa(linhaPlanilha) {
        if (!confirm("Confirmar a conclusão deste chamado?")) return;

        try {
            await fetch(`${SCRIPT_URL}?action=updateStatus&row=${linhaPlanilha}`, {
                method: 'POST'
            });
            await carregarChamados();
        } catch (error) {
            alert("Erro ao dar baixa no chamado.");
            console.error(error);
        }
    }

    // Inicializa o painel ao abrir a página
    carregarChamados();
</script>

</body>
</html>
